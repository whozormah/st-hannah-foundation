# SEC-05: rate limiting at Nginx as well as in the application.
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=public_forms:10m rate=20r/m;

# Answer a throttled request with 429, not nginx's default 503: it says what
# actually happened, and does not read as the site being down.
limit_req_status 429;

upstream app {
    server app:3000;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name sthannahfoundation.org www.sthannahfoundation.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 12m;  # MED-03: uploads are capped at 10 MB.

    # SEC-12: standard security headers. The Content-Security-Policy is set
    # at the edge, where it can be tuned without a deployment.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The login endpoint, rate limited hardest. Cloudflare Access sits in
    # front of /admin and challenges before this is ever reached (SEC-02).
    location /api/admin-users/login {
        limit_req zone=admin_login burst=3 nodelay;
        proxy_pass http://app;
        include /etc/nginx/proxy_params_shf;
    }

    location /admin {
        proxy_pass http://app;
        include /etc/nginx/proxy_params_shf;
    }

    # PAY-06: the webhook must answer within 5 seconds and is exempt from the
    # admin rate limit.
    location /api/webhooks/ {
        proxy_pass http://app;
        include /etc/nginx/proxy_params_shf;
        proxy_read_timeout 10s;
    }

    location ~ ^/api/(contact|newsletter|volunteer-application|aid-application|in-kind-donation|partnership|international-interest) {
        limit_req zone=public_forms burst=5 nodelay;
        proxy_pass http://app;
        include /etc/nginx/proxy_params_shf;
    }

    location / {
        proxy_pass http://app;
        include /etc/nginx/proxy_params_shf;
    }
}
