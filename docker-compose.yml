# Production topology (section 3, Figure 1): Nginx, one application container
# carrying Next.js and Payload together, and PostgreSQL beside them.
#
# ARC-05: the image is built in CI and only pulled here. Never build on the
# droplet — a Next production build alone exceeds the whole 1 GB machine.
services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_params_shf:/etc/nginx/proxy_params_shf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    mem_limit: 64m

  app:
    image: ${APP_IMAGE:-ghcr.io/whozormah/st-hannah-foundation:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      DONATION_EMAIL: ${DONATION_EMAIL}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_PUBLIC: ${R2_BUCKET_PUBLIC}
      R2_BUCKET_PRIVATE: ${R2_BUCKET_PRIVATE}
    expose:
      - "3000"
    # Section 3: roughly 400 MB of the 1 GB budget.
    mem_limit: 512m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ARC-07: tuned for the 1 GB tier.
    command: >
      postgres
      -c shared_buffers=96MB
      -c work_mem=4MB
      -c max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ARC-03: never published to the host or the internet.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 192m

volumes:
  pgdata:
