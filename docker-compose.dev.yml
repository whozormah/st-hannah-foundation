# Local PostgreSQL for development and the access-control test suite.
# Not production: production is docker-compose.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: shf-dev-pg
    environment:
      POSTGRES_USER: shf
      POSTGRES_PASSWORD: shf_local_dev
      POSTGRES_DB: shf
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shf -d shf"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - shf-dev-pgdata:/var/lib/postgresql/data

volumes:
  shf-dev-pgdata:
